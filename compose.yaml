name: workoutly
services:
  mysql:
    image: mysql:9.6.0
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Execute python3 scripts/dev.py init}
      MYSQL_USER: ${MYSQL_USER:?Configure MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Configure MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Configure MYSQL_ROOT_PASSWORD}
      MYSQL_ROOT_HOST: "%"
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_PASSWORD}\" mysql -h127.0.0.1 -u\"$${MYSQL_USER}\" \"$${MYSQL_DATABASE}\" -Nse 'SELECT 1'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
volumes:
  mysql_data:
